[workspace]
members = [
    "crates/llm",
    "crates/socio",
    "crates/socio/backend",
    "crates/agentloop",
    "crates/api_clients"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Shahroz Alauddin <shahroz@example.com>"]
license = "MIT"
repository = "https://github.com/shahrozalauddin/socio-ai-agent"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
